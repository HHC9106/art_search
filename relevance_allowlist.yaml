# Strong allow-list filter, applied ONLY to multi-source aggregators
# (sources.yaml entries with apply_relevance_filter: true — currently
# ArtRabbit, Artists Now, The Space, and Art Quest). These pull in dozens of
# listings per run with no editorial curation, so unlike the rest of the
# pipeline, a listing from one of these sources must actively match
# something below to survive at all — everything else is dropped entirely.
#
# Singular/watch sources (V&A, Barbican, FACT, etc.) are NOT affected by
# this file — those were already chosen deliberately one at a time.
#
# A listing passes if EITHER:
#   - its title/description/eligibility text matches a keyword here, or one
#     already defined in scraper/discipline_tags.py (that vocabulary is
#     reused here rather than duplicated), OR
#   - its organizer matches (substring, case-insensitive) an entry in
#     `organizers` below — typically the same organizations behind the
#     singular watch sources, so their listings aren't lost if they also
#     turn up on an aggregator.
#
# Edit freely — no code changes needed. "research" is deliberately broad and
# will over-match; tighten it here if it lets through too much noise.
#
# A few requested terms were left out of extra_keywords below because
# they're already covered elsewhere: "data art" and "civic technology" are
# already in scraper/discipline_tags.py (data_art and civic_tech tags);
# "creative coding" was already present here before this list was added.

extra_keywords:
  # Practice
  - computational art
  - data sculpture
  - data sonification
  - interactive installation
  - physical computing
  - creative coding
  - digital fabrication
  - sound installation
  - media installation

  # Themes
  - social data
  - civic data
  - environmental data
  - data justice
  - algorithmic governance
  - algorithmic accountability
  - urban
  - urban infrastructure
  - urban metabolism
  - waste systems
  - critical infrastructure
  - satellite imagery
  - remote sensing
  - census data
  - classification systems
  - digital society
  - artificial intelligence
  - intelligence
  - environment
  - environmental
  - research
  - creative tech
  - creative technology
  - data visualization
  - data visualisation

  # Critical technology
  - forensic architecture
  - investigative media
  - investigative technology
  - forensic media
  - spatial investigation
  - evidence-based art
  - institutional critique
  - public accountability
  - infrastructure politics
  - critical cartography
  - computational design

organizers:
  - Victoria and Albert Museum
  - Barbican
  - Peckham Digital
  - FACT
  - Furtherfield
  - Vivid Projects
  - Site Gallery
