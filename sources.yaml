      - '"art prize" "digital art"'
      - '"open call" "data art"'
      - '"open call" "civic tech"'
      - '"open call" "open data"'
      - '"artist residency" "urban data"'
      - '"open call" "AI art"'
      - '"artist residency" "artificial intelligence"'
      - '"artist grant" "digital art"'
      - '"artist fellowship" "media art"'
      - '"open call" "algorithmic"'
      - '"open call" "institutional critique"'
      - '"open call" "data justice"'
  notes: >
    Disabled as of 2026-07-28: Google removed "search the entire web" for
    new free Programmable Search Engines - a PSE can now only search a
    fixed list of ~50 specific domains you configure, not the open web, so
    this adapter would return little value even with a real API key. Left
    in place (code + tests untouched, query list preserved) in case you
    later decide to configure it against a curated domain allowlist, or
    switch to a different provider (e.g. Brave Search API) that still
    offers real whole-web search. For now, superseded by the manual
    /web-scan skill (see claude_web_scan_leads below and
    .claude/skills/web-scan/SKILL.md), which runs these same themed queries via
    Claude's own web search when you ask for it, judges relevance/freshness
    directly instead of via keyword matching, and appends genuine new leads
    as manual entries.

