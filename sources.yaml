# --- Aggregators (international, mixed/unknown region per listing) ---

- name: artrabbit_opportunities
  display_name: "ArtRabbit – Artist Opportunities"
  organizer: "ArtRabbit"
  country: null
  adapter: html
  url: "https://www.artrabbit.com/artist-opportunities"
  enabled: true
  listing_type: open_call
  apply_relevance_filter: true
  parser_options:
    item_selector: "div.artopp"
    title_selector: "h2 a"
    link_selector: "h2 a"
    deadline_attr: "data-d"
    description_selector: "h3.b_categorical-heading"
  notes: >
    Verified working: ~57 live international listings, deadline read from the
    data-d="YYYYMMDD" attribute (more reliable than text parsing). No per-item
    location on the index page, so region_tier falls back to the "medium"
    config default for everything here regardless of true geography — use
    discipline/search filters to narrow down, or set a per-country override in
    the dashboard once you spot a pattern. ArtRabbit's own category (Prize/
    Residency/Collaboration/etc., captured in description) doesn't map cleanly
    to our listing_type enum, so listing_type is left as the open_call default.
    apply_relevance_filter: true means only listings matching the practice
    keyword list survive - organizer here is always the literal string
    "ArtRabbit" (no per-item organizer scraped from the index page), so the
    organizer allowlist in relevance_allowlist.yaml never applies to this
    source; keyword match is the only path through for ArtRabbit listings.

- name: thespace
  display_name: "The Space — Opportunities from Across the Sector"
  organizer: "The Space"
  country: null
  adapter: custom
  url: "https://www.thespace.org/resource/news-and-opportunities-from-across-the-sector/"
  enabled: true
  listing_type: open_call
  apply_relevance_filter: true
  notes: >
    Curated digest page, not a repeating card structure - each opportunity is
    a pair of consecutive <p> tags (arrow-emoji description + link, then a
    separate "Deadline: ..." paragraph), so this needed a bespoke
    scraper/adapters/custom/thespace.py rather than the generic html adapter.
    Only extracts the "Currently open for applications" and "Midlands
    opportunities" sections - deliberately skips Events/Conferences,
    Resources, and webinar sections further down the same page, which use
    identical paragraph styling but aren't open calls. Deadlines are often
    bare day+month with no year ("31 July") - parsed assuming the current
    year, rolling to next year if that's already past. No per-item location,
    so region_tier falls back to the "medium" config default like ArtRabbit.

# --- Single-institution watch pages (quarterly) ---
# These sites only ever show their OWN opportunity (not an aggregator), and
# rarely change, so they're checked quarterly instead of weekly. adapter: html
# with parser_options.single_page: true treats the whole page as one watched
# item: it hashes the main content region, and if that hash changes since the
# last quarterly check, the listing resurfaces as "new" (see run.py) even
# though its id/url stay the same — a nudge to go look, not a real deep link
# to a specific opportunity.
#
# Convention: any singular/single-institution source defaults to region_tier:
# high (an explicit override below, not derived from country) since you chose
# to track it specifically - bump it to top, or down to medium/low, per source
# as you like; the dashboard's per-country override also applies on top of this.

- name: va_residencies_watch
  display_name: "V&A Residencies — Open Calls (watch)"
  organizer: "Victoria and Albert Museum"
  country: "UK"
  region_tier: high
  adapter: html
  url: "https://www.vam.ac.uk/info/residencies"
  enabled: true
  listing_type: residency
  frequency: quarterly
  parser_options:
    single_page: true
    content_selector: "main"
  notes: >
    No open call listed as of 2026-07-28 — the page's dedicated "Open Calls"
    section explicitly says "We currently have no Open Calls." Content there
    is freeform CMS text, not a repeatable card structure, so per-item scraping
    isn't reliable even once populated - this just watches the whole page for
    any change and flags it for a manual look.

