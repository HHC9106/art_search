# Pluggable source configuration for the scraper.
#
# Each entry describes one site/feed to check. Adding a real source is normally
# just editing this file — no code changes needed — unless a site is irregular
# enough to need a bespoke scraper/adapters/custom/<name>.py module.
#
# Fields:
#   name             stable snake_case key. Used to hash listing ids. Never rename
#                    an entry once enabled, or every listing from it will look "new".
#   adapter          rss | html | playwright | manual | custom
#   url              the feed/page to fetch. Leave "TBD" (and enabled: false) until verified.
#   region_tier      leave null to derive from `country` via tier_config.yaml; set
#                    one of top/high/medium/low as a string to force-override.
#   parser_options   adapter-specific settings (CSS selectors for html/playwright, etc.)
#   manual_entries   only used by adapter: manual — hand-curated leads with no scrapable page.
#
# The entries below are a STARTING POINT proposed during planning, not verified
# scrape targets. Real URLs/selectors still need to be supplied and confirmed.

# --- Top tier: UK ---

- name: artistsnow_opportunities
  display_name: "Artists Now (formerly a-n) – Opportunities"
  organizer: "Artists Now"
  country: "UK"
  adapter: html
  url: "https://www.artistsnow.com/page-types/job_listing/resultSection/?categories=awards&categories=commissions&categories=exhibitions&categories=funding&categories=residencies&categories=other&categories=professional-development"
  enabled: true
  listing_type: open_call
  apply_relevance_filter: true
  parser_options:
    item_selector: ".article-list-item"
    title_selector: ".article-title a"
    link_selector: ".article-title a"
    organizer_selector: ".article-name"
    deadline_selector: ".job-meta:nth-of-type(1) .job-meta-value"
    eligibility_selector: ".job-meta:nth-of-type(2) .job-meta-value"
    fee_selector: ".job-meta:nth-of-type(3) .job-meta-value"
    description_selector: ".article-text"
    google_search_link: true
  notes: >
    a-n.co.uk now redirects to artistsnow.com (rebrand). url is the raw AJAX
    fragment endpoint used to actually fetch data (categories= params exclude
    Jobs/Selling/Studios at the source - confirmed working via the site's own
    filter, "Displaying N results" drops accordingly - leaving Awards/
    Commissions/Exhibitions/Funding/Residencies/Other/Professional development,
    ~57 of ~97 total). Individual listing links and "load more" pagination
    both require an Artists Now account, so only the first 10 of those ~57
    (sorted soonest-closing) are visible, and there's no usable direct link
    at all - google_search_link makes the title link a Google search for
    "<title> <organizer>" instead, which usually surfaces the organizer's own
    page for the opportunity rather than a login wall. eligibility_selector
    here actually captures location (job-meta order is Closing date /
    Location / Payment), reused since there's no dedicated location field in
    the schema. country is statically "UK" though some listings are flagged
    "Outside of the UK" on the real site — a known imprecision.

