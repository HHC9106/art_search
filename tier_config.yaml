# Default nation/region -> priority tier mapping, used by the scraper (and
# thus the email digest, which is server-side and can't see browser
# localStorage). The dashboard itself lets you override any country's tier
# live in the browser — this file is just the starting default before you've
# customized anything, and what quietly falls back into place if you clear
# your browser data.
#
# Levels: top | high | medium | low. Countries not listed anywhere fall back
# to `default`. Edit freely — no code changes needed.

default: medium

levels:
  top:
    - uk
    - united kingdom
    - england
    - scotland
    - wales
    - northern ireland
    - gb
    - great britain

  high:
