<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Art Open Calls & Prizes</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Art Open Calls &amp; Prizes</h1>
    <p id="meta-badge" class="meta-badge">Loading…</p>
  </header>

  <section class="controls">
    <div class="control-group" id="tier-filter">
      <span class="control-label">Tier</span>
      <label><input type="checkbox" value="1" checked /> UK</label>
      <label><input type="checkbox" value="2" checked /> US/EU/TW</label>
      <label><input type="checkbox" value="3" checked /> Other</label>
    </div>

    <div class="control-group">
      <span class="control-label">Type</span>
      <select id="type-filter">
        <option value="">All</option>
        <option value="open_call">Open call</option>
        <option value="prize">Prize</option>
        <option value="residency">Residency</option>
        <option value="grant">Grant</option>
      </select>
    </div>

    <div class="control-group">
      <span class="control-label">Status</span>
      <select id="status-filter">
        <option value="open" selected>Open only</option>
        <option value="">Open + closed</option>
        <option value="closed">Closed only</option>
      </select>
    </div>

    <div class="control-group">
      <span class="control-label">Tracking</span>
      <select id="tracking-filter">
        <option value="">All</option>
        <option value="none">Unmarked</option>
        <option value="interested">Interested</option>
        <option value="applied">Applied</option>
        <option value="accepted">Accepted</option>
        <option value="rejected">Rejected</option>
        <option value="ignored">Ignored</option>
      </select>
    </div>

    <div class="control-group">
      <span class="control-label">Sort</span>
      <select id="sort-order">
        <option value="tier-deadline" selected>Tier, then deadline</option>
        <option value="deadline">Deadline</option>
        <option value="recent">Recently added</option>
      </select>
    </div>

    <div class="control-group grow">
      <input type="search" id="search-box" placeholder="Search title / organizer…" />
    </div>

    <div class="control-group">
      <button id="export-btn" type="button">Export tracking</button>
      <button id="import-btn" type="button">Import tracking</button>
      <input type="file" id="import-file" accept="application/json" hidden />
    </div>
  </section>

  <main>
    <table id="listings-table">
      <thead>
        <tr>
          <th>Title</th>
          <th>Organizer</th>
          <th>Tier</th>
          <th>Type</th>
          <th>Deadline</th>
          <th>Fee</th>
          <th>Prize</th>
          <th>Tracking</th>
        </tr>
      </thead>
      <tbody id="listings-body"></tbody>
    </table>
    <p id="empty-state" class="empty-state" hidden>No listings match the current filters.</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
