name: scrape-and-publish

on:
  schedule:
    - cron: "0 6 * * 1"        # weekly, Monday 06:00 UTC
    - cron: "0 6 1 1,4,7,10 *" # quarterly, 1st of Jan/Apr/Jul/Oct 06:00 UTC - single-institution watch sources
  workflow_dispatch:
    inputs:
      cadence:
        description: "Which sources to run (matches sources.yaml frequency; 'all' ignores frequency)"
        type: choice
        options: [all, weekly, quarterly]
        default: all
  push:
    branches: [main, first_draft]
    paths:
      - "scraper/**"
      - "sources.yaml"
      - ".github/workflows/scrape.yml"

permissions:
  contents: write

concurrency:
  group: scrape-and-publish
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scraper/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scraper/requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('scraper/requirements.txt') }}

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Determine cadence
        id: cadence
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.cadence }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 6 1 1,4,7,10 *" ]; then
            echo "value=quarterly" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            echo "value=weekly" >> "$GITHUB_OUTPUT"
          else
            echo "value=all" >> "$GITHUB_OUTPUT"
          fi

      - name: Run scraper (fetch, normalize, write, email)
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python -m scraper.run --cadence ${{ steps.cadence.outputs.value }}

      - name: Commit data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/listings.json docs/data/meta.json
          git diff --cached --quiet || git commit -m "chore(data): update listings [skip ci]"
          git push
